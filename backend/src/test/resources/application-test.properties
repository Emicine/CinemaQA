# Test profile — separate in-memory H2, faster DDL, seeder disabled
spring.datasource.url=jdbc:h2:mem:mrs-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

jwt.expiry-minutes=60

# Disable seeder in tests by overriding credentials to a value that won't conflict
app.super-admin.username=test-super-admin
app.super-admin.password=TestPassword@99
app.super-admin.email=test-super@test.com

cors.allowed-origins=http://localhost:3000
logging.level.root=WARN
logging.level.com.redcinema=INFO

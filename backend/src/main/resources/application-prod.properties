# ── PostgreSQL (prod) ─────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/mrs}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DATABASE_USER:mrs}
spring.datasource.password=${DATABASE_PASSWORD:secret}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=false

# ── JWT (override via env var in prod) ────────────────────────────────────────
jwt.expiry-minutes=${JWT_EXPIRY_MINUTES:60}

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.redcinema=INFO
logging.level.org.springframework.security=WARN

# ── CORS ──────────────────────────────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://redcinema.com}

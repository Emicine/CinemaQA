version: "3.9"

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mrs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       mrs
      POSTGRES_USER:     mrs
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secret}
    ports:
      - "5433:5433"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrs"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot API ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mrs-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE:    prod
      DATABASE_URL:               jdbc:postgresql://postgres:5432/mrs
      DATABASE_USER:              mrs
      DATABASE_PASSWORD:          ${DATABASE_PASSWORD:-secret}
      JWT_EXPIRY_MINUTES:         ${JWT_EXPIRY_MINUTES:-60}
      CORS_ALLOWED_ORIGINS:       ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      SUPER_ADMIN_USERNAME:       ${SUPER_ADMIN_USERNAME:-superAdmin}
      SUPER_ADMIN_PASSWORD:       ${SUPER_ADMIN_PASSWORD:-superPassword@123}
      SUPER_ADMIN_EMAIL:          ${SUPER_ADMIN_EMAIL:-superadmin@redcinema.com}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
